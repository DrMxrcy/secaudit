name: Copilot Setup Steps

# Prepares the Copilot coding agent's environment. Copilot only honours this job's
# steps, permissions, runs-on, services, snapshot and timeout-minutes.
#
# runs-on stays the STANDARD ubuntu-latest runner: that is free for a public repo.
# Larger runners are billed even on public repos, so never switch this to one.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  # The job MUST be called `copilot-setup-steps` or Copilot will not pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # The repo's scripts are stdlib-only: Python is the whole toolchain.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
